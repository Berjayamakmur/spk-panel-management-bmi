<!DOCTYPE html>
<html lang="id"><head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPK Panel Management V2.1</title>
<style>
:root{--navy:#173b68;--blue:#2563eb;--yellow:#f5b82e;--bg:#f3f6fb;--ink:#172033;--muted:#718096;--line:#e5eaf1;--green:#15966a}
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:#fff}.hero{background:linear-gradient(145deg,#102c50,#1e5793);color:#fff;padding:7vw;display:flex;flex-direction:column;justify-content:center}.mark{width:54px;height:54px;background:var(--yellow);color:#102c50;border-radius:14px;display:grid;place-items:center;font-weight:900}
.company-logo{display:block;width:min(390px,100%);height:auto;object-fit:contain;background:#fff;border-radius:8px;padding:8px}
.brand-logo{display:block;width:190px;max-width:100%;height:auto;object-fit:contain;background:#fff;border-radius:6px;padding:4px}
.hero .company-logo{margin-bottom:24px}
.brand{align-items:center}.hero h1{font-size:42px;line-height:1.1}.hero p{line-height:1.7;color:#d8e5f5;max-width:500px}.loginbox{display:grid;place-items:center;padding:25px}.loginform{width:min(400px,100%)}.loginform h2{font-size:28px;margin-bottom:6px}.muted{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:7px;margin:0 0 13px}.field label{font-weight:700;font-size:12px;color:#35445b}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ed;border-radius:9px;padding:11px;background:#fff}.field textarea{min-height:85px;resize:vertical}
.btn{padding:10px 14px;border-radius:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary{background:var(--blue);color:white}.light{background:#edf2f8;color:#28415f}.danger{background:#feecec;color:#b42323}.block{width:100%}
.error,.ok{padding:10px;border-radius:8px;margin:10px 0}.error{background:#fff0f0;color:#b42323}.ok{background:#e9fbf3;color:#08764e}
.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:#122f52;color:#d9e5f4;padding:20px 14px;display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:10px;align-items:center}.brand .mark{width:39px;height:39px}.brand b{color:white}.brand small{display:block;color:#a9bfd9;margin-top:4px}.navlabel{font-size:10px;letter-spacing:1px;color:#829bb8;margin:12px 8px 5px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#c8d6e7;padding:11px;border-radius:8px;margin:3px 0}.nav button.active,.nav button:hover{background:#244b76;color:white}.sidefoot{margin-top:auto;border-top:1px solid #2b496a;padding-top:14px}.main{min-width:0}.top{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:4}.content{padding:24px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{font-size:23px;margin:0 0 5px}.panel,.metric{background:white;border:1px solid var(--line);border-radius:12px;padding:17px;margin-bottom:15px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:28px;margin-top:10px}.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}.chart{height:190px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding:10px}.barcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px}.bar{width:65%;max-width:25px;background:#3479e5;border-radius:5px 5px 0 0}.barcol small{font-size:10px;color:var(--muted)}.track{height:8px;background:#edf1f6;border-radius:20px;overflow:hidden;margin:7px 0 15px}.fill{height:100%}.yellow{background:#e8ad22}.blue{background:#3978e8}.green{background:#19a477}
table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f5;font-size:12px;white-space:nowrap}th{font-size:10px;color:#77869b;text-transform:uppercase}.tablewrap{overflow:auto}.badge{padding:5px 8px;border-radius:30px;font-size:10px;font-weight:bold}.pending{background:#fff4d8;color:#966500}.process{background:#e8f0ff;color:#245bc4}.done{background:#e3f8ef;color:#08764e}
.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;align-items:end}.filters .field{margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{background:#f7f9fc;padding:12px;border-radius:8px}.detail small{display:block;color:var(--muted);margin-bottom:5px}.timeline{border-left:2px solid #dce7f7;margin-left:8px;padding-left:18px}.event{margin-bottom:17px;position:relative}.event:before{content:"";position:absolute;left:-24px;top:2px;width:10px;height:10px;border-radius:50%;background:#3475dc;border:3px solid #e7effd}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.photo{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}.photo img{width:100%;height:125px;object-fit:cover;background:#eef2f7}.photo div{padding:9px;font-size:11px}.toast{position:fixed;right:18px;bottom:18px;background:#183b66;color:white;padding:12px 16px;border-radius:9px;z-index:9}.mobile{display:none}
@media(max-width:950px){.metrics{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.login{grid-template-columns:1fr}.hero{display:none}.app{grid-template-columns:1fr}.side{position:fixed;z-index:8;top:0;bottom:0;left:-260px;width:240px;transition:.2s}.side.open{left:0}.mobile{display:inline-block}.content{padding:16px}.top{padding:0 14px}.grid2{grid-template-columns:1fr}.formgrid,.details{grid-template-columns:1fr}.span2{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr 1fr}}
</style></head><body>

<script>
const S={token:"",user:null,rows:[],types:[],editing:null,reportFilters:{}},$=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const date=v=>{if(!v)return"-";let p=String(v).slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:v};
const dt=v=>{let d=new Date(v);return isNaN(d)?"-":d.toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})};
function rpc(fn,...args){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e.message||e)))[fn](S.token,...args))}
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),3200)}
function msg(id,t,bad=true){$(id).innerHTML=`<div class="${bad?"error":"ok"}">${esc(t)}</div>`}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{let r=await new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no).loginUser($("email").value,$("password").value));if(!r.success){msg("loginMsg",r.message);return}S.token=r.data.token;sessionStorage.setItem("spkv2",S.token);await start(r.data)}catch(x){msg("loginMsg",x.message)}};
async function start(user){S.user=user;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("sideName").textContent=user.nama;$("sideRole").textContent=user.role;$("who").textContent=user.nama+" · "+user.role;$("adminMenu").classList.toggle("hidden",user.role!=="Admin");await dashboard()}
async function logout(){try{await rpc("logoutUser")}catch(e){}S.token="";sessionStorage.removeItem("spkv2");$("app").classList.add("hidden");$("login").classList.remove("hidden");$("password").value=""}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));
function go(p){$("side").classList.remove("open");document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("title").textContent=({dashboard:"Dashboard",spk:"Data SPK",form:"Form SPK",reports:"Laporan Produksi",users:"Manajemen User",logs:"Log Aktivitas"})[p];if(p==="dashboard")dashboard();if(p==="spk")loadSpk();if(p==="form")form();if(p==="reports")reports();if(p==="users")users();if(p==="logs")logs()}
function badge(s){return `<span class="badge ${s==="Selesai"?"done":s==="Sedang Diproses"?"process":"pending"}">${esc(s)}</span>`}
async function dashboard(){ $("content").innerHTML="Memuat dashboard...";try{let d=(await rpc("getDashboard")).data,c=d.status_counts,m=Math.max(1,...d.grafik_bulanan.map(x=>x.jumlah));$("content").innerHTML=`
<div class="head"><div><h1>Dashboard Produksi</h1><span class="muted">Ringkasan pekerjaan pembuatan panel.</span></div><button class="btn primary" onclick="go('form')">＋ Buat SPK</button></div>
<div class="metrics"><div class="metric"><small>SPK Aktif</small><strong>${d.total_spk_aktif}</strong></div><div class="metric"><small>Total Unit Panel</small><strong>${d.total_unit}</strong></div><div class="metric"><small>Sedang Diproses</small><strong>${c.sedang_diproses}</strong></div><div class="metric"><small>SPK Selesai</small><strong>${c.selesai}</strong></div></div>
<div class="grid2"><div class="panel"><h3>Tren SPK · 12 Bulan</h3><div class="chart">${d.grafik_bulanan.map(x=>`<div class="barcol"><b>${x.jumlah}</b><div class="bar" style="height:${Math.max(2,x.jumlah/m*100)}%"></div><small>${x.bulan.slice(5)}</small></div>`).join("")}</div></div>
<div class="panel"><h3>Status Produksi</h3>${statusLine("Belum Diproses",c.belum_diproses,c,"yellow")}${statusLine("Sedang Diproses",c.sedang_diproses,c,"blue")}${statusLine("Selesai",c.selesai,c,"green")}</div></div>
<div class="panel"><h3>5 SPK Terbaru</h3>${tableSpk(d.spk_terbaru,true)}</div>`}catch(e){$("content").textContent=e.message}}
function statusLine(n,v,c,color){let t=c.belum_diproses+c.sedang_diproses+c.selesai;return `<p>${n} <b style="float:right">${v} · ${t?Math.round(v/t*100):0}%</b></p><div class="track"><div class="fill ${color}" style="width:${t?v/t*100:0}%"></div></div>`}
async function loadSpk(){try{let r=await rpc("getAllSpk",{});S.rows=r.data;S.types=[...new Set(S.rows.map(x=>x.jenis_panel))];renderSpk()}catch(e){toast(e.message)}}
function tableSpk(rows,short=false){return `<div class="tablewrap"><table><thead><tr><th>No SPK</th><th>Tanggal</th><th>Pelanggan</th><th>Project</th><th>Lokasi Proyek</th><th>Jenis Panel</th><th>Unit</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.no_spk)}</b></td><td>${date(x.tanggal_spk)}</td><td>${esc(x.nama_pelanggan)}</td><td>${esc(x.nama_project)}</td><td>${esc(x.lokasi_proyek||"-")}</td><td>${esc(x.jenis_panel)}</td><td>${x.jumlah_unit}</td><td>${badge(x.status_produksi)}</td><td><button class="btn light" onclick="detail('${x.id}')">Detail</button>${short?"":` <button class="btn light" onclick="form('${x.id}')">Edit</button> ${S.user.role==="Admin"?`<button class="btn danger" onclick="del('${x.id}')">Hapus</button>`:""}`}</td></tr>`).join("")||'<tr><td colspan="9">Belum ada data.</td></tr>'}</tbody></table></div>`}
function renderSpk(){ $("content").innerHTML=`<div class="head"><div><h1>Data SPK</h1><span class="muted">Pencarian dan pengelolaan SPK panel.</span></div><button class="btn primary" onclick="go('form')">＋ Tambah SPK</button></div><div class="panel"><div class="filters">
<div class="field"><label>Tanggal Mulai</label><input type="date" id="f1"></div><div class="field"><label>Tanggal Akhir</label><input type="date" id="f2"></div><div class="field"><label>Pelanggan</label><input id="f3" placeholder="Nama pelanggan"></div><div class="field"><label>Jenis Panel</label><select id="f4"><option value="">Semua</option>${S.types.map(x=>`<option>${esc(x)}</option>`)}</select></div><div class="field"><label>No SPK / Project</label><input id="f5" placeholder="Cari"></div></div><p><button class="btn primary" onclick="filterSpk()">Filter</button> <button class="btn light" onclick="loadSpk()">Reset</button></p><div id="spkTable">${tableSpk(S.rows)}</div></div>`}
async function filterSpk(){try{let r=await rpc("getAllSpk",{tanggal_mulai:$("f1").value,tanggal_akhir:$("f2").value,nama_pelanggan:$("f3").value,jenis_panel:$("f4").value,search_text:$("f5").value});$("spkTable").innerHTML=tableSpk(r.data)}catch(e){toast(e.message)}}
async function form(id){
  let x={};if(id){try{x=(await rpc("getSpkById",id)).data}catch(e){toast(e.message);return}}
  S.editing=id||null;S.items=(x.items&&x.items.length?x.items:[{nama_panel:"",jumlah_unit:1,spesifikasi:""}]).map(v=>({...v}));
  $("title").textContent=id?"Edit SPK":"Form SPK";
  $("content").innerHTML=`<div class="head"><div><h1>${id?"Edit SPK":"Input SPK Baru"}</h1><span class="muted">Satu pelanggan, satu project, beberapa item panel.</span></div><button class="btn light" onclick="go('spk')">← Kembali</button></div><div class="panel"><form id="spkForm"><h3>Identitas SPK</h3><div class="formgrid">
  ${field("no_spk","No. SPK",x.no_spk,"text",true)}${field("tanggal_spk","Tanggal SPK",x.tanggal_spk||new Date().toISOString().slice(0,10),"date",true)}
  ${field("nama_pelanggan","Nama Pelanggan",x.nama_pelanggan,"text",true)}${field("nama_project","Nama Project",x.nama_project,"text",true)}\n  ${field("lokasi_proyek","Lokasi Proyek",x.lokasi_proyek,"text",true)}
  <div class="field span2"><label>Keterangan Umum SPK</label><textarea name="keterangan">${esc(x.keterangan||"")}</textarea></div>
  ${id?`<div class="field"><label>Status Produksi</label><select name="status_produksi">${["Belum Diproses","Sedang Diproses","Selesai"].map(t=>`<option ${x.status_produksi===t?"selected":""}>${t}</option>`).join("")}</select></div>`:""}
  </div><h3>Daftar Item Panel</h3><div id="itemEditor"></div><button type="button" class="btn light" onclick="addPanelItem()">＋ Tambah Panel</button><p><b>Total Unit: <span id="totalPanelUnit">0</span></b></p><div id="formMsg"></div><div class="actions"><button type="button" class="btn light" onclick="go('spk')">Batal</button><button class="btn primary">Simpan SPK</button></div></form></div>`;
  renderPanelItems();
  $("spkForm").onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.items=readPanelItems();try{if(S.editing)await rpc("updateSpk",S.editing,d);else await rpc("createSpk",d);toast("SPK dan item panel tersimpan.");go("spk")}catch(z){msg("formMsg",z.message)}};
}
function readPanelItems(){return [...document.querySelectorAll(".panel-item")].map(el=>({nama_panel:el.querySelector("[data-name]").value,jumlah_unit:Number(el.querySelector("[data-qty]").value),spesifikasi:el.querySelector("[data-spec]").value}));}
function renderPanelItems(){
  $("itemEditor").innerHTML=S.items.map((it,i)=>`<div class="panel panel-item" style="background:#f8fafc"><div class="head"><b>Panel ${i+1}</b>${S.items.length>1?`<button type="button" class="btn danger" onclick="removePanelItem(${i})">Hapus Item</button>`:""}</div><div class="formgrid"><div class="field"><label>Nama Panel *</label><input data-name required maxlength="150" value="${esc(it.nama_panel||"")}" placeholder="Contoh: Panel Booster Pump VSD"></div><div class="field"><label>Jumlah Unit *</label><input data-qty type="number" required min="1" step="1" value="${Number(it.jumlah_unit)||1}" oninput="updatePanelTotal()"></div><div class="field span2"><label>Spesifikasi Teknis Panel</label><textarea data-spec maxlength="5000" placeholder="Dimensi, PLC, inverter, komponen, wiring, dan catatan teknis">${esc(it.spesifikasi||"")}</textarea></div></div></div>`).join("");updatePanelTotal();
}
function addPanelItem(){S.items=readPanelItems();S.items.push({nama_panel:"",jumlah_unit:1,spesifikasi:""});renderPanelItems()}
function removePanelItem(i){S.items=readPanelItems();if(S.items.length<=1)return;S.items.splice(i,1);renderPanelItems()}
function updatePanelTotal(){let el=$("totalPanelUnit");if(el)el.textContent=[...document.querySelectorAll("[data-qty]")].reduce((n,x)=>n+(Number(x.value)||0),0)}
function field(n,l,v,type="text",req=false){return `<div class="field"><label>${l}${req?" *":""}</label><input name="${n}" type="${type}" value="${esc(v??"")}" ${req?"required":""} ${type==="number"?'min="1" step="1"':""}></div>`}
async function detail(id){try{let x=(await rpc("getSpkById",id)).data,photos=(await rpc("getSpkPhotos",id)).data;$("title").textContent="Detail SPK";$("content").innerHTML=`
<div class="head"><div><h1>Detail SPK · ${esc(x.no_spk)}</h1><span class="muted">${esc(x.nama_project)}</span></div><div><button class="btn light" onclick="go('spk')">← Daftar</button> <button class="btn primary" onclick="printSpk('${id}')">Cetak PDF SPK</button> <button class="btn light" onclick="form('${id}')">Edit</button></div></div>
<div class="panel"><div style="display:flex;justify-content:space-between"><h2>${esc(x.no_spk)}</h2>${badge(x.status_produksi)}</div><div class="details">${detailItem("Tanggal",date(x.tanggal_spk))}${detailItem("Pelanggan",x.nama_pelanggan)}${detailItem("Project",x.nama_project)}${detailItem("Lokasi Proyek",x.lokasi_proyek||"-")}${detailItem("Jenis Panel",x.jenis_panel)}${detailItem("Jumlah Unit",x.jumlah_unit+" unit")}<div class="detail"><small>Keterangan</small>${esc(x.keterangan||"-")}</div></div></div>
<div class="panel"><h3>Rincian Item Panel</h3>${(x.items||[]).map((it,i)=>`<div class="detail" style="margin-bottom:10px"><b>${i+1}. ${esc(it.nama_panel)} — ${it.jumlah_unit} unit</b><p style="white-space:pre-wrap">${esc(it.spesifikasi||"-")}</p></div>`).join("")}</div><div class="panel"><h3>Dokumentasi Foto Produksi</h3><div class="formgrid"><div class="field"><label>Ambil Foto / Pilih dari Galeri</label><input type="file" id="photoFile" accept="image/jpeg,image/png,image/webp" capture="environment"></div><div class="field"><label>Kategori</label><select id="photoCat"><option>Progres</option><option>Material</option><option>Wiring</option><option>Assembly</option><option>Testing</option><option>Final</option></select></div><div class="field span2"><label>Keterangan Foto</label><input id="photoNote" placeholder="Contoh: Proses wiring panel booster pump"></div></div><button class="btn primary" onclick="uploadPhoto('${id}')">Upload Foto ke Google Drive</button><p class="muted">JPG, PNG, WEBP · Maksimal 5 MB per foto.</p><div id="photoMsg"></div><div class="photos">${photos.map(p=>`<div class="photo"><a href="${esc(p.drive_url)}" target="_blank"><div style="height:100px;display:grid;place-items:center;background:#edf2f8">Foto tersimpan di Drive</div></a><div><b>${esc(p.kategori)}</b><br>${esc(p.keterangan)}<br><small>${dt(p.uploaded_at)} · ${esc(p.uploaded_by)}</small><br><a href="${esc(p.drive_url)}" target="_blank">Buka file Drive ↗</a></div></div>`).join("")||"<p class='muted'>Belum ada foto.</p>"}</div></div>
<div class="panel"><h3>Riwayat Status Produksi</h3><div class="timeline">${x.riwayat_status.map(h=>`<div class="event"><b>${esc(h.status)}</b><div class="muted">${dt(h.timestamp)} · ${esc(h.diubah_oleh)}</div><small>${esc(h.catatan)}</small></div>`).join("")||"Belum ada riwayat."}</div></div>`}catch(e){toast(e.message)}}
function detailItem(k,v){return `<div class="detail"><small>${esc(k)}</small><b>${esc(v)}</b></div>`}
async function uploadPhoto(id){let file=$("photoFile").files[0];if(!file){toast("Pilih foto terlebih dahulu.");return}if(file.size>5*1024*1024){toast("Ukuran foto maksimal 5 MB.");return}try{let base64=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(file)});let r=await rpc("uploadSpkPhoto",{spk_id:id,file_name:file.name,mime_type:file.type,base64,kategori:$("photoCat").value,keterangan:$("photoNote").value});toast(r.message);detail(id)}catch(e){msg("photoMsg",e.message)}}
async function printSpk(id){try{let r=await rpc("exportSpkPdf",id);window.open(r.data.url,"_blank");toast("PDF dibuat di Google Drive.")}catch(e){toast(e.message)}}
async function del(id){if(!confirm("Hapus SPK ini? Foto dan metadata dokumentasi akan tetap menjadi arsip."))return;try{await rpc("deleteSpk",id);toast("SPK dihapus.");loadSpk()}catch(e){toast(e.message)}}
function reports(){ $("content").innerHTML=`<div class="head"><div><h1>Laporan Progres Produksi</h1><span class="muted">Rekap SPK dan unit panel berdasarkan periode.</span></div></div><div class="panel"><div class="filters"><div class="field"><label>Tanggal Mulai</label><input type="date" id="rStart"></div><div class="field"><label>Tanggal Akhir</label><input type="date" id="rEnd"></div><div class="field"><label>Status</label><select id="rStatus"><option value="">Semua Status</option>${["Belum Diproses","Sedang Diproses","Selesai"].map(s=>`<option>${s}</option>`)}</select></div></div><p><button class="btn primary" onclick="runReport()">Tampilkan</button> <button class="btn light" onclick="exportReport('csv')">Export CSV</button> <button class="btn light" onclick="exportReport('pdf')">Export PDF</button></p><div id="reportResult"></div></div>`}
function reportFilter(){return {tanggal_mulai:$("rStart").value,tanggal_akhir:$("rEnd").value,status_produksi:$("rStatus").value}}
async function runReport(){try{let r=await rpc("getProductionReport",reportFilter()),d=r.data;$("reportResult").innerHTML=`<div class="metrics"><div class="metric"><small>Total SPK</small><strong>${d.summary.total_spk}</strong></div><div class="metric"><small>Total Unit</small><strong>${d.summary.total_unit}</strong></div><div class="metric"><small>Dalam Proses</small><strong>${d.summary.status_counts["Sedang Diproses"]}</strong></div><div class="metric"><small>Selesai</small><strong>${d.summary.status_counts["Selesai"]}</strong></div></div>${tableSpk(d.rows,true)}`}catch(e){toast(e.message)}}
async function exportReport(type){try{let r=type==="csv"?await rpc("exportProductionCsv",reportFilter()):await rpc("exportProductionPdf",reportFilter());window.open(r.data.url,"_blank");toast("File laporan dibuat di Google Drive.")}catch(e){toast(e.message)}}
async function users(){try{let a=(await rpc("listUsers")).data;$("content").innerHTML=`<div class="head"><div><h1>Manajemen User</h1><span class="muted">Pembuatan dan pengaturan akun.</span></div></div><div class="grid2"><div class="panel"><h3>Tambah Pengguna</h3><form id="userForm">${field("nama","Nama","","text",true)}${field("email","Email","","email",true)}<div class="field"><label>Role</label><select name="role"><option>Operator Produksi</option><option>Admin</option></select></div>${field("password","Password (min. 12 karakter)","","password",true)}<div id="userMsg"></div><button class="btn primary">Buat Akun</button></form></div><div class="panel"><h3>Daftar Pengguna</h3><div class="tablewrap"><table><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Aksi</th></tr>${a.map(x=>`<tr><td>${esc(x.nama)}</td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${x.aktif?"Aktif":"Nonaktif"}</td><td><button class="btn light" onclick="toggleUser('${x.id}',${!x.aktif})">${x.aktif?"Nonaktifkan":"Aktifkan"}</button></td></tr>`).join("")}</table></div></div></div>`;$("userForm").onsubmit=async e=>{e.preventDefault();try{await rpc("createUser",Object.fromEntries(new FormData(e.target)));toast("User dibuat.");users()}catch(z){msg("userMsg",z.message)}}}catch(e){toast(e.message)}}
async function toggleUser(id,a){try{await rpc("setUserActive",id,a);users()}catch(e){toast(e.message)}}
async function logs(){try{let a=(await rpc("getActivityLogs",250)).data;$("content").innerHTML=`<div class="head"><div><h1>Log Aktivitas</h1><span class="muted">Audit aktivitas pengguna.</span></div></div><div class="panel"><div class="tablewrap"><table><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Detail</th><th>SPK ID</th></tr>${a.map(x=>`<tr><td>${dt(x.timestamp)}</td><td>${esc(x.user_email)}</td><td>${esc(x.aksi)}</td><td>${esc(x.detail)}</td><td>${esc(x.spk_id)}</td></tr>`).join("")}</table></div></div>`}catch(e){toast(e.message)}}
(async()=>{let t=sessionStorage.getItem("spkv2");if(t){S.token=t;try{let r=await rpc("getInitialData");await start(r.user)}catch(e){sessionStorage.removeItem("spkv2");S.token=""}}})();
</script></body></html>
